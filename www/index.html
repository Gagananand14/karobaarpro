<script>
/* ============ KarobaarPro by Gagan IT — core (data, sync, helpers) ============ */
const CONFIG={
  SITE_NAME:'KarobaarPro by Gagan IT',
  API_URL:'pos-api.php',
  NATIVE_API_URL:'https://gaganit.com/karobaarpro/pos-api.php',   // Android app (bundle) isi address se server se judta hai
  VER:'1.2',
  CONTACT_PHONE:'8092871923',
  CONTACT_WA:'918092871923',
  PRO_PRICE_TEXT:'Sirf ₹199/mahina (ya ₹1499/saal) — apna rate yahin badal lein',
  PRO_FREE_FOR_ALL:false   // true karne par sabhi Pro features sab ke liye khul jaate hain
};
const FREE_ITEMS=100;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
function money(n,sign){n=r2(n);const a=Math.abs(n);const s=a.toLocaleString('en-IN',{minimumFractionDigits:a%1?2:0,maximumFractionDigits:2});return (sign&&n<0?'-':'')+'₹'+s}
const pad=n=>String(n).padStart(2,'0');
function today(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return today(d)}
function fdate(iso){if(!iso)return '';const p=String(iso).slice(0,10).split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:iso}
function dOf(ms){return today(new Date(ms))}
function tOf(ms){const d=new Date(ms);let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(d.getMinutes())+' '+ap}
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
function phoneIN(p){p=String(p||'').replace(/\D/g,'');if(p.length===10)return '91'+p;return p}
function waUrl(phone,text){const p=phoneIN(phone);return 'https://wa.me/'+(p?p:'')+'?text='+encodeURIComponent(text)}
const IS_NATIVE=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
function nativeSave(name,blob){/* Android app: file cache me likh kar share sheet (Save / WhatsApp / Drive) */
  if(!IS_NATIVE())return false;const P=Capacitor.Plugins||{};if(!P.Filesystem||!P.Share)return false;
  const fr=new FileReader();fr.onload=async()=>{try{const r=await P.Filesystem.writeFile({path:name,data:String(fr.result).split(',')[1],directory:'CACHE'});await P.Share.share({title:name,url:r.uri,dialogTitle:'Save / Share'})}catch(e){if(!/cancel/i.test(String((e&&e.message)||e)))toast('File save nahi hui')}};
  fr.readAsDataURL(blob);return true}
function download(name,blob){if(nativeSave(name,blob))return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function safeName(s){return String(s||'file').replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_').slice(0,40)}
function t(k){return k}

/* ===== IndexedDB (bada data bhi sambhal leta hai); na chale to localStorage ===== */
const IDB=(()=>{let p=null;
  function open(){if(p)return p;p=new Promise((res,rej)=>{try{const q=indexedDB.open('gits_pos',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});return p}
  async function get(k){try{const db=await open();return await new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return lsGet('posd_'+k,undefined)}}
  async function set(k,v){try{const db=await open();await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return true}catch(e){return lsSet('posd_'+k,v)}}
  return{get,set}})();

/* ===== data store ===== */
const COLLS=['items','custs','sales','mv','led','exps','buys','shifts','apps','sups','sled','emps','att','sal','docs'];
let PREF=Object.assign({size:'80',theme:'light'},lsGet('pos_pref',{}));
function savePref(){lsSet('pos_pref',PREF)}
let ACC=lsGet('pos_acc',null);   // {phone,token,uid,name,role,shop_name} | {demo:true,role:'owner'} | null
let D=null,REV=0;
function emptyShop(){return{name:'',addr:'',phone:'',gstin:'',upi:'',footer:'Dhanyavad! Phir aaiyega.',size:'80',gst:0,ro:1,biz:'',type:'',email:'',wa:'',pre:'',terms:'',owner:'',logo:'',u:0}}
function emptyD(){const d={shop:emptyShop(),meta:{since:0,dirty:{},last:0,hold:[]}};COLLS.forEach(c=>d[c]=[]);return d}
const dkey=()=>'d_'+(ACC&&ACC.phone?ACC.phone+'_'+ACC.uid:'demo');
const dkeyShared=()=>'d_'+(ACC&&ACC.phone?ACC.phone+'_'+ACC.uid:'demo');
async function loadLocal(){const d=await IDB.get(dkey());D=emptyD();if(d){COLLS.forEach(c=>{if(Array.isArray(d[c]))D[c]=d[c]});if(d.shop)D.shop=Object.assign(emptyShop(),d.shop);if(d.meta)D.meta=Object.assign(D.meta,d.meta);if(!D.meta.dirty)D.meta.dirty={};if(!D.meta.hold)D.meta.hold=[]}REV++}
let saveT=null,SAVING=false;
function saveLocal(now){clearTimeout(saveT);const go=async()=>{if(!D)return;const ok=await IDB.set(dkey(),D);if(!ok)toast('⚠ Phone me jagah nahi — backup lein')};now?go():(saveT=setTimeout(go,350))}
function touch(){REV++;saveLocal();syncSoon()}
const live=c=>D[c].filter(x=>!x.d);
const byId=(c,id)=>D[c].find(x=>x.id===id&&!x.d);
function put(c,rec){rec.u=Date.now();const a=D[c];const i=a.findIndex(x=>x.id===rec.id);if(i<0)a.push(rec);else a[i]=rec;D.meta.dirty[c+':'+rec.id]=rec.u;touch();return rec}
function putShop(){D.shop.u=Date.now();D.meta.dirty.shop=D.shop.u;touch()}
function del(c,id){const r=D[c].find(x=>x.id===id);if(!r)return;r.d=1;r.u=Date.now();D.meta.dirty[c+':'+id]=r.u;touch()}
window.addEventListener('pagehide',()=>saveLocal(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveLocal(true)});

/* ===== roles ===== */
const ROLE=()=>(ACC&&ACC.role)||'cashier';
const isOwner=()=>ROLE()==='owner';
const isMgr=()=>ROLE()==='owner'||ROLE()==='manager';
const roleName=r=>({owner:'Malik',manager:'Manager',accountant:'Accountant',auditor:'Auditor',cashier:'Cashier',salesman:'Salesman',storekeeper:'Store keeper'}[r]||r);
const isMoney=()=>['owner','manager','accountant','auditor'].includes(ROLE());      /* lagat, kharche, supplier, munafa dekh sake */
const canSell=()=>['owner','manager','cashier','salesman'].includes(ROLE());
const canMoneyW=()=>['owner','manager','accountant'].includes(ROLE());
const canStockW=()=>['owner','manager','storekeeper'].includes(ROLE());
const isAuditor=()=>ROLE()==='auditor';

/* ===== plan ===== */
let PLAN={pro:false,until:0};
const isPro=()=>CONFIG.PRO_FREE_FOR_ALL||!!PLAN.pro||(ACC&&ACC.demo&&false);
function loadPlan(){PLAN=lsGet('pos_plan_'+(ACC&&ACC.phone||'demo'),{pro:false,until:0})}
function setPlan(r){PLAN={pro:!!r.pro,until:r.pro_until||0};lsSet('pos_plan_'+(ACC&&ACC.phone||'demo'),PLAN);if(r.cfg){CFG=r.cfg;lsSet('pos_cfg',CFG)}}
let CFG=lsGet('pos_cfg',{free:true,plans:[],pay_wa:'',msgs:[]});
const DEVICE=()=>{const m=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent),sa=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);return IS_NATIVE()?'android':sa?(m?'pwa-mobile':'pwa-desktop'):(m?'web-mobile':'web-desktop')};
const msgOff=()=>lsGet('pos_msg_x',[]);
function dismissMsg(id){const a=msgOff();a.push(+id);lsSet('pos_msg_x',a.slice(-50))}
function msgsHtml(){const off=msgOff(),L=((CFG&&CFG.msgs)||[]).filter(m=>!off.includes(+m.id));return L.map(m=>'<div class="card" style="border-left:4px solid '+(m.kind==='warn'?'#d97706':m.kind==='promo'?'#f59e0b':'#1d4ed8')+';display:flex;gap:8px"><div class="grow">'+(m.title?'<b>'+esc(m.title)+'</b><br>':'')+'<span class="sm">'+esc(m.body)+'</span></div><button class="ib" data-mx="'+m.id+'" aria-label="hatayein" style="width:30px;height:30px">✕</button></div>').join('')}

/* ===== stock (movement entries ka jod — do phone ek saath bechein tab bhi galat nahi hota) ===== */
let SC={rev:-1,m:null};
function stockMap(){if(SC.rev===REV)return SC.m;const m=new Map();D.mv.forEach(x=>{if(x.d)return;m.set(x.i,(m.get(x.i)||0)+num(x.q))});SC={rev:REV,m};return m}
const stockOf=id=>stockMap().get(id)||0;
function addMv(i,q,r,ref,note){if(!q)return;return put('mv',{id:'mv_'+uid(),i,q:r2(q),t:Date.now(),r,ref:ref||'',note:note||''})}

/* ===== udhar balance (har customer ka) ===== */
let BC={rev:-1,m:null};
function balances(){if(BC.rev===REV)return BC.m;const m=new Map();live('custs').forEach(c=>m.set(c.id,{bal:num(c.open),n:0,last:0}));
  live('led').forEach(x=>{const e=m.get(x.c);if(!e)return;e.bal+=num(x.a);e.n++;if((x.t||0)>e.last)e.last=x.t});BC={rev:REV,m};return m}
const balOf=id=>{const e=balances().get(id);return e?e.bal:0};

/* ===== server ===== */
async function api(body){
  try{
    const r=await fetch(IS_NATIVE()?CONFIG.NATIVE_API_URL:CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({dev:DEVICE(),v:CONFIG.VER},body))});
    const tx=await r.text();let j;try{j=JSON.parse(tx)}catch(e){return{ok:false,error:'Server se galat jawab aaya (pos-api.php sahi jagah rakhi hai?)'}}
    return j;
  }catch(e){return{ok:false,error:'Internet nahi hai — data phone me safe hai, net aate hi sync hoga',net:true}}
}
let SYNCING=false,syncT=null,SYNCSTATE='';
function syncSoon(){if(!ACC||ACC.demo||!ACC.token)return;clearTimeout(syncT);syncT=setTimeout(()=>sync(),2000)}
function setSyncState(s){SYNCSTATE=s;const e=$('syncDot');if(e){e.className='sdot '+s;e.title={ok:'Sync ho gaya',busy:'Sync ho raha hai…',err:'Sync me dikkat — dabakar dobara try karein',off:'Offline'}[s]||''}}
function applyIncoming(c,rec,force){
  const a=D[c];const i=a.findIndex(x=>x.id===rec.id);const key=c+':'+rec.id;
  if(i<0){a.push(rec);return true}
  const loc=a[i];
  if(force||rec.u>loc.u){a[i]=rec;if(force)delete D.meta.dirty[key];return true}
  if(!D.meta.dirty[key]&&rec.u===loc.u&&(rec.s||0)!==(loc.s||0)){a[i]=rec}   /* apna hi likha hua lauta: sirf server ka stamp lo, screen mat chhedo */
  return false;
}
async function sync(manual){
  if(!ACC||ACC.demo||!ACC.token)return false;
  if(SYNCING){syncSoon();return false}
  SYNCING=true;setSyncState('busy');
  let got=false,okAll=true;
  try{
    for(let round=0;round<25;round++){
      const ch={},sent={};let n=0;
      for(const k in D.meta.dirty){
        if(n>=800)break;
        if(k==='shop'){ch.shop=D.shop;sent[k]=D.shop.u;continue}
        const i=k.indexOf(':'),c=k.slice(0,i),id=k.slice(i+1);const r=D[c]&&D[c].find(x=>x.id===id);
        if(r){(ch[c]=ch[c]||[]).push(r);sent[k]=r.u;n++}else delete D.meta.dirty[k];
      }
      const r=await api({action:'sync',phone:ACC.phone,token:ACC.token,since:Math.max(0,D.meta.since-2),changes:ch});
      if(!r.ok){
        okAll=false;
        if(!r.net&&/Login|Session|user band/i.test(r.error||'')){ACC.token='';lsSet('pos_acc',ACC);setSyncState('off');showAuth('login','Dobara login karein');}
        else setSyncState(r.net?'off':'err');
        if(manual)toast(r.error||'Sync nahi hua');
        return false;
      }
      const C=r.changes||{};
      COLLS.forEach(c=>{(C[c]||[]).forEach(rec=>{if(applyIncoming(c,rec,false))got=true});(C['__back_'+c]||[]).forEach(rec=>{if(applyIncoming(c,rec,true))got=true})});
      if(C.shop&&C.shop.u>=D.shop.u&&!(D.meta.dirty.shop&&D.shop.u>C.shop.u)){const nw=C.shop.u>D.shop.u;D.shop=Object.assign(emptyShop(),C.shop);if(nw)got=true}
      (r.rej||[]).forEach(x=>{delete D.meta.dirty[x.k];if(x.k==='shop'){}});
      for(const k in sent){if(D.meta.dirty[k]===undefined)continue;let cur=0;if(k==='shop')cur=D.shop.u;else{const i=k.indexOf(':');const rr=D[k.slice(0,i)].find(x=>x.id===k.slice(i+1));cur=rr?rr.u:0}if(cur===sent[k])delete D.meta.dirty[k]}
      D.meta.since=r.ver;D.meta.last=Date.now();setPlan(r);
      if(r.role&&ACC.role!==r.role){ACC.role=r.role;lsSet('pos_acc',ACC)}
      if(r.rej&&r.rej.length){toast('⚠ '+r.rej[0].why)}
      REV++;
      if(!r.more&&!Object.keys(D.meta.dirty).length)break;
      if(!r.more&&!n)break;
    }
  }finally{SYNCING=false}
  saveLocal(true);setSyncState(okAll?'ok':'err');
  if(got&&typeof onRemoteChange==='function')onRemoteChange();
  if(manual)toast('Sync ho gaya ✔');
  return true;
}
window.addEventListener('online',()=>sync());
setInterval(()=>{if(!document.hidden)sync()},60000);

/* ===== billing helpers ===== */
const PAYMODES=[['cash','💵 Cash'],['upi','📱 UPI'],['card','💳 Card']];
function lineAmt(l){const g=num(l.q)*num(l.p);const d=num(l.da)>0?num(l.da):g*Math.min(100,num(l.dp))/100;return r2(Math.max(0,g-d))}
function cartTotals(cart){
  let sub=0,tax=0;
  cart.lines.forEach(l=>{const a=lineAmt(l);sub+=a;if(D.shop.gst&&num(l.tx)>0)tax+=a-a/(1+num(l.tx)/100)});
  sub=r2(sub);tax=r2(tax);
  let disc=cart.discType==='pct'?r2(sub*Math.min(100,num(cart.disc))/100):Math.min(sub,num(cart.disc));disc=r2(disc);
  if(sub>0&&disc>0&&tax>0)tax=r2(tax*(sub-disc)/sub);
  let tot=r2(sub-disc),rnd=0;
  if(cart.ro!=null?cart.ro:D.shop.ro){const t2=Math.round(tot);rnd=r2(t2-tot);tot=t2}
  return{sub,tax,disc,rnd,tot}
}
function nextNo(o){o=o||{};
  const lg=D.shop.ipad==null,pre=o.pre!=null?String(o.pre):(lg?(D.shop.pre?D.shop.pre+'-':'INV-'):String(D.shop.pre==null?'INV-':D.shop.pre)),pd=o.ipad!=null?num(o.ipad):(lg?4:num(D.shop.ipad)),st=Math.max(1,num(o.istart!=null?o.istart:D.shop.istart)||1);
  const re=new RegExp('^'+pre.replace(/[.*+?^${}()|[\]\\\/-]/g,'\\$&')+'(\\d+)$');let mx=0;
  D.sales.forEach(s=>{const m=re.exec(String(s.no||''));if(m){const n=parseInt(m[1],10);if(n>mx)mx=n}});

function docSheet(doc){

/* ---- Print (browser print layer; thermal 58/80mm भी) ---- */
function docHtml(doc,paper){
  const thermal=/^p\d+$/.test(paper||''),narrow=thermal,pmm=thermal?parseInt(paper.slice(1)):0;
  const Tk=fmtOf(doc),hl=!narrow&&Tk.hl&&doc.logo;
  let h='<div class="pdoc '+(thermal?(pmm<=58?'p58':'p80')+' tf-'+(doc.tf||'classic'):(paper||'a4')+' f-'+fmtKey(doc))+'"'+(thermal?' style="width:'+(pmm-4)+'mm"':'')+'>';
  const hd=(doc.head||[]).map(x=>'<div class="ph '+(x.s||'')+'">'+esc(x.t).replace(/\n/g,'<br>')+'</div>').join('');
  if(hl)h+='<div class="phl"><img alt="" src="'+doc.logo+'"><div class="phb">'+hd+'</div>'+(Tk.tag&&doc.title?'<div class="ptag">'+esc(String(doc.title).toUpperCase())+'</div>':'')+'</div>';
  else{if(doc.logo)h+='<div class="ph"><img alt="" src="'+doc.logo+'" style="max-height:'+(narrow?60:80)+'px;max-width:100%"></div>';h+=hd}
  h+='<hr>';if(doc.title&&!(hl&&Tk.tag))h+='<div class="pt">'+esc(doc.title)+'</div>';
  if(doc.meta&&doc.meta.length)h+='<div class="pm">'+doc.meta.map(m=>'<div><b>'+esc(m[0])+':</b> '+esc(m[1])+'</div>').join('')+'</div>';
  if(doc.cols&&doc.cols.length){
    h+='<table><thead><tr>'+doc.cols.map(c=>'<th'+(c.a==='r'?' class="r"':'')+'>'+esc(c.h)+'</th>').join('')+'</tr></thead><tbody>';
    (doc.rows||[]).forEach(r=>h+='<tr>'+r.map((c,i)=>'<td'+(doc.cols[i].a==='r'?' class="r"':'')+(c&&c.b?' style="font-weight:700"':'')+'>'+esc(dv(c))+'</td>').join('')+'</tr>');
    h+='</tbody></table>';
  }
  if(doc.totals&&doc.totals.length)h+='<table class="tot">'+doc.totals.map(tt=>'<tr class="'+(tt.big?'big':'')+'"><td>'+esc(tt[0])+'</td><td class="r">'+esc(dv(tt[1]))+'</td></tr>').join('')+'</table>';
  if(doc.words)h+='<div class="pw"><b>Amount in words:</b> '+esc(doc.words)+'</div>';
  if(doc.gstt&&doc.gstt.rows.length)h+='<table class="gstt"><thead><tr>'+doc.gstt.cols.map((c,i)=>'<th'+(i?' class="r"':'')+'>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+doc.gstt.rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i?' class="r"':'')+'>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  if((doc.bank&&doc.bank.length)||doc.qr)h+='<div class="pbk">'+(doc.bank&&doc.bank.length?'<div><b>'+(narrow?'Pay':'Bank / Payment details')+'</b><br>'+doc.bank.map(esc).join('<br>')+'</div>':'')+(doc.qr?'<div class="pq"><img alt="" src="'+doc.qr+'"><br><small>Scan karke payment karein</small></div>':'')+'</div>';
  (doc.notes||[]).forEach(n=>h+='<div class="pn">'+esc(n).replace(/\n/g,'<br>')+'</div>');
  if(doc.sign)h+='<div class="psg"><div>For '+esc(doc.sign[0])+'</div><div class="sgl">'+esc(doc.sign[1])+'</div></div>';
  return h+'</div>';
}

    (W.t==='g'?'<label class="row" style="color:var(--tx)"><input type="checkbox" id="fraw" '+(W.raw?'checked':'')+'> Ye sirf raw material hai (khud nahi bikta, services me lagta hai)</label>':'')+

  };

function returnSheet(s){
  const f=s.sub>0?(s.sub-num(s.disc))/s.sub:1;
  sheet('<h3>Return / Wapsi — '+esc(s.no)+'</h3><p class="mut sm">Jitna maal wapas aaya, uski quantity daalein.</p><div id="rl">'+s.lines.map((l,i)=>'<div class="row"><div class="grow"><b>'+esc(l.n)+'</b><br><small class="mut">'+l.q+' × '+money(l.p)+'</small></div><input data-i="'+i+'" inputmode="decimal" style="width:80px" placeholder="0" max="'+l.q+'"></div>').join('')+'</div><div class="card tight" id="rr"></div>'+field('Paisa kaise wapas','<select id="rm" style="width:100%"><option value="cash">Cash</option><option value="upi">UPI</option></select>')+'<button class="btn pri big" id="rok">Return darj karein</button>',x=>{
    const calc=()=>{let a=0;x.querySelectorAll('#rl input').forEach(i=>{const l=s.lines[+i.dataset.i];const q=Math.min(num(i.value),num(l.q));a+=q*num(l.p)});return r2(a*f)};
    x.querySelector('#rl').oninput=()=>x.querySelector('#rr').innerHTML='Wapas dena: <b>'+money(calc())+'</b>';x.querySelector('#rl').oninput();
    x.querySelector('#rok').onclick=()=>{
      const lines=[];x.querySelectorAll('#rl input').forEach(i=>{const l=s.lines[+i.dataset.i];const q=Math.min(num(i.value),num(l.q));if(q>0)lines.push({...l,q:-q})});
      if(!lines.length)return toast('Koi quantity nahi daali');const ref=calc();
      let fromDue=0;if(num(s.due)>0&&s.cust&&s.cust.id){const owed=Math.max(0,balOf(s.cust.id));fromDue=Math.min(ref,num(s.due),owed)}

let RF=null,RT=null;
function repData(from,to){
  const S=salesIn(from,to);const mg=isMoney();
  const bills=S.filter(s=>s.st==='ok');const rets=S.filter(s=>s.st==='ret');
  const total=S.reduce((a,s)=>a+num(s.tot),0);const pay=sumPay(S);
  const coll={cash:0,upi:0,card:0};live('led').filter(x=>x.r==='pay'&&dOf(x.t)>=from&&dOf(x.t)<=to&&(mg||x.by===ACC.uid)).forEach(x=>{coll[x.pm||'cash']=(coll[x.pm||'cash']||0)+(-num(x.a))});
  const disc=bills.reduce((a,s)=>a+num(s.disc),0);
  const profit=mg?S.reduce((a,s)=>a+saleProfit(s),0):null;
  const E=mg?expsIn(from,to):[];const exp=E.reduce((a,e)=>a+num(e.a),0);
  const top={};S.forEach(s=>(s.lines||[]).forEach(l=>{const k=l.n;const o=top[k]||(top[k]={n:k,q:0,a:0,p:0});o.q+=num(l.q);o.a+=lineAmt(l);o.p+=mg&&l.bp!=null?lineAmt(l)-lineCost(l):0}));
  const staff={};S.forEach(s=>{const k=s.bn||s.by||'?';const o=staff[k]||(staff[k]={n:k,c:0,a:0,d:0});if(s.st==='ok')o.c++;o.a+=num(s.tot);o.d+=num(s.disc)});
  const days={};S.forEach(s=>{const d=saleDate(s);days[d]=(days[d]||0)+num(s.tot)});
  return{S,bills,rets,total,pay,coll,disc,profit,E,exp,top:Object.values(top).sort((a,b)=>b.a-a.a),staff:Object.values(staff).sort((a,b)=>b.a-a.a),days}
}

function guessKind(name,rows){const n=String(name).toLowerCase();if(/item|product|stock|inventory/.test(n))return 'items';if(/supplier|vendor|purchase part/.test(n))return 'sups';if(/customer|part(y|ies)|client/.test(n))return 'custs';
  let best=null,bs=0;['items','custs'].forEach(k=>{const al=new Set(IMF[k].flatMap(f=>f[2])),c=Math.max(0,...rows.slice(0,20).map(r=>r.filter(x=>al.has(nk(x))).length));if(c>bs){bs=c;best=k}});return bs>=2?best:null}
function findHeader(rows,kind){const al=new Set(IMF[kind].flatMap(f=>f[2]));let hr=-1,hc=1;rows.slice(0,25).forEach((r,i)=>{const c=r.filter(x=>x!=null&&al.has(nk(x))).length;if(c>hc){hc=c;hr=i}});return hr}
function autoMap(kind,hdr){const m={};IMF[kind].forEach(f=>{const i=hdr.findIndex(h=>f[2].includes(nk(h)));if(i>=0)m[f[0]]=i});return m}

function impBuild(sheets){IMP={tables:[],upd:true,done:null};sheets.forEach((sh,i)=>{const kind=guessKind(sh.name,sh.rows);if(!kind&&sh.rows.length<2)return;
  const k=kind||'custs',hr=findHeader(sh.rows,k);if(hr<0){if(kind)IMP.tables.push({id:i,name:sh.name,kind:'',rows:sh.rows,hr:0,hdr:[],map:{},on:false});return}
  const hdr=sh.rows[hr].map(x=>x==null?'':String(x)),data=sh.rows.slice(hr+1).filter(r=>r.some(x=>x!=null&&String(x).trim()!=='')&&!/^total/i.test(String(r[0]||'').trim()));
  IMP.tables.push({id:i,name:sh.name,kind:k,hdr,data,map:autoMap(k,hdr),on:data.length>0})})}
const gv=(r,t,k)=>t.map[k]!=null?r[t.map[k]]:undefined,sv=v=>v==null?'':String(v).trim(),cl=v=>{const x=sv(v);return x==='-'||x==='—'?'':x};
function impRows(t){return t.data.map(r=>{const o={};IMF[t.kind].forEach(f=>{o[f[0]]=gv(r,t,f[0])});return o}).filter(o=>sv(o.n))}

      ['code','hsn','bc','desc','loc'].forEach(k=>{if(cl(o[k]))it[k]=cl(o[k])});const stk=o.stock!=null&&sv(o.stock)!==''?num(o.stock):null;

    else{const col=t.kind==='custs'?'custs':'sups';L.forEach(o=>{const nm=sv(o.n),ph=sv(o.ph).replace(/\D/g,'').slice(-10);let c=live(col).find(x=>(ph&&(x.ph||'')===ph)||(sv(x.n).toLowerCase()===nm.toLowerCase()&&(!ph||!x.ph)));

      if(cl(o.ad))c.ad=cl(o.ad);if(cl(o.sta))c.sta=cl(o.sta);if(cl(o.gs))c.gs=cl(o.gs);if(cl(o.gr))c.gr=cl(o.gr);if(cl(o.em))c.em=cl(o.em);if(o.lim!=null&&sv(o.lim)!=='')c.lim=num(o.lim);if(cl(o.vid))c.vid=cl(o.vid);

    rep.push({name:t.name,kind:t.kind,nw,up,sk,lim,total:L.length})});

/* ===== Day close ===== */
function vClose(){
  const t0=today(),mg=isMgr();
  const S=salesIn(t0,t0);const pay=sumPay(S);
  const coll=live('led').filter(x=>x.r==='pay'&&x.pm==='cash'&&dOf(x.t)===t0&&(mg||x.by===ACC.uid)).reduce((a,x)=>a+(-num(x.a)),0);
  const ex=mg?live('exps').filter(e=>e.date===t0&&(e.pm||'cash')==='cash').reduce((a,e)=>a+num(e.a),0):0;
  const hist=live('shifts').filter(x=>mg||x.by===ACC.uid).sort((a,b)=>b.t-a.t).slice(0,15);
  const lastCnt=hist.length?hist[0].cnt:0;
  $('main').innerHTML=head('Din band / Cash ginti',true)+
   '<div class="card"><h3>Aaj ka cash hisaab ('+fdate(t0)+')</h3><table class="rt"><tr><td>Subah gale me (opening)</td><td class="r"><input id="co" inputmode="decimal" style="width:100px;text-align:right" value="'+(lastCnt||'')+'" placeholder="0"></td></tr><tr><td>+ Cash bikri</td><td class="r">'+money(pay.cash)+'</td></tr><tr><td>+ Udhar vasooli (cash)</td><td class="r">'+money(coll)+'</td></tr>'+(mg?'<tr><td>− Cash kharche</td><td class="r">'+money(ex)+'</td></tr>':'')+'<tr><td><b>Gale me hona chahiye</b></td><td class="r"><b id="cexp"></b></td></tr></table>'+
   field('Gale me asli cash (ginkar)','<input id="cc" inputmode="decimal" class="bigin">')+'<div class="chres center" id="cdiff"></div>'+field('Note','<input id="cn" maxlength="80">')+'<button class="btn pri big" id="cok">Din band karein / Save</button></div>'+
   '<h3>Pichhle closing</h3>'+(hist.length?hist.map(h=>'<div class="li big"><div class="grow"><b>'+fdate(h.date)+'</b><small class="mut">'+esc(h.bn||'')+' · hona chahiye '+money(h.exp)+', mila '+money(h.cnt)+'</small></div><b class="'+(h.diff<0?'neg':h.diff>0?'pos':'')+'">'+(h.diff>0?'+':'')+money(h.diff)+'</b></div>').join(''):'<p class="mut">Abhi koi nahi</p>');
  const calc=()=>r2(num($('co').value)+pay.cash+coll-ex);
  const upd=()=>{$('cexp').textContent=money(calc());const v=$('cc').value;$('cdiff').innerHTML=v===''?'':(()=>{const d=r2(num(v)-calc());return d===0?'<span class="pos">✔ Cash bilkul barabar</span>':'<span class="'+(d<0?'neg':'pos')+'">'+(d<0?'Kam hai: ':'Zyada hai: ')+money(Math.abs(d))+'</span>'})()};
  upd();$('co').oninput=upd;$('cc').oninput=upd;
  $('cok').onclick=()=>{const v=$('cc').value;if(v==='')return toast('Asli cash daalein');const e=calc();put('shifts',{id:'sh_'+uid(),date:t0,open:num($('co').value),exp:e,cnt:num(v),diff:r2(num(v)-e),note:$('cn').value.trim(),sales:r2(pay.cash+pay.upi+pay.card+pay.credit),t:Date.now(),bn:ACC.name,by:ACC.uid});toast('Din band ho gaya ✔');vClose()};
}

  if(ow){$('qrf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const r=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);D.shop.qr=c.toDataURL('image/jpeg',.92);putShop();$('qrp').src=D.shop.qr;$('qrp').hidden=false;toast('QR lag gaya ✔')};im.onerror=()=>toast('Image nahi khuli');im.src=URL.createObjectURL(f)};$('qrx').onclick=()=>{D.shop.qr='';putShop();$('qrp').hidden=true;toast('QR hata diya')}}
  const pk=$('pok');if(pk)pk.onclick=async()=>{const p1=$('p1').value.trim(),p2=$('p2').value.trim();if(!/^\d{4,8}$/.test(p2))return toast('Naya PIN 4-8 ank');const r=await api({action:'changepin',phone:ACC.phone,token:ACC.token,pin:p1,newpin:p2});toast(r.ok?'PIN badal gaya (baaki phone logout)':r.error);if(r.ok){$('p1').value='';$('p2').value=''}};
}

/* ===== Backup ===== */
function vBackup(){
  $('main').innerHTML=head('Backup / Restore',true)+
   '<div class="card"><h3>Backup file (JSON)</h3><p class="mut sm">Poora data ek file me. Mahine me ek baar zarur rakhein.</p><button class="btn pri big" id="b1">⬇ Backup download</button></div>'+
   '<div class="card"><h3>Items ki Excel list</h3><button class="btn g big" id="b3">📊 Items Excel '+(isPro()?'':'⭐')+'</button></div>'+
   (isOwner()?'<div class="card"><h3>Restore / import</h3><p class="mut sm">Purani backup file chunein. Purana data mitta nahi, file ka data jud jata hai.</p><input type="file" id="b2" accept=".json,application/json"></div>':'');
  $('b1').onclick=()=>{const o={app:'gits-pos',v:1,t:Date.now(),shop:D.shop};COLLS.forEach(c=>o[c]=D[c]);download('POS_backup_'+today()+'.json',new Blob([JSON.stringify(o)],{type:'application/json'}))};
  $('b3').onclick=()=>{if(!needPro('Excel export'))return;const I=live('items');exportXlsx([{title:'Items',head:[],meta:[],cols:[{h:'Naam',w:4},{h:'Type',w:1},{h:'Rate',w:1,a:'r'},{h:'Stock',w:1,a:'r'},{h:'Unit',w:1}],rows:I.map(x=>[x.n,x.t==='s'?'Service':'Saaman',cell(money(x.sp),num(x.sp)),x.ts?cell(String(r2(stockOf(x.id))),r2(stockOf(x.id))):'',x.un||'']),totals:[],notes:[],sheet:'Items'}],'Items_'+today())};
  if(isOwner())$('b2').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(o.app!=='gits-pos')throw 0;let n=0;
    COLLS.forEach(c=>(o[c]||[]).forEach(r=>{if(!r||!r.id)return;if(D[c].some(x=>x.id===r.id))return;const rr={...r};delete rr.s;rr.u=Date.now();D[c].push(rr);D.meta.dirty[c+':'+rr.id]=rr.u;n++}));
    touch();toast(n+' records jude ✔');route()}catch(er){toast('Ye sahi backup file nahi hai')}};
}

  $('main').innerHTML=head('Plan / Pro',true)+

   '<div class="card scroll"><table class="rt"><tr><th>Suvidha</th><th class="r">Free</th><th class="r">Pro ⭐</th></tr>'+
   row('Billing, print (58/80mm/A4), WhatsApp bill','✔','✔')+row('Items / Services (fees, raw material, lagat)','100 tak','Unlimited')+row('Stock, kam-stock alert','✔','✔')+row('Udhar khata','✔','✔')+row('Staff login (Cashier)','1','10')+row('Manager role','✖','✔')+row('Audit — kisne kya kiya','Aakhri 30','Poora')+row('Din ki cash ginti, kharche, munafa report','✔','✔')+row('Report PDF / Excel','✖','✔')+row('GST invoice','✖','✔')+row('Customer ko udhar yaad (WhatsApp)','✖','✔')+row('Purchase register','✖','✔')+'</table></div>'+
   '<div class="card"><b>'+esc(CONFIG.PRO_PRICE_TEXT)+'</b><p class="mut sm">Pro lene ke liye call/WhatsApp karein. Shop number batayein: <b>'+esc(ACC.phone||'')+'</b></p><div class="row wrap"><a class="btn pri" href="tel:+91'+CONFIG.CONTACT_PHONE+'">📞 '+CONFIG.CONTACT_PHONE+'</a><a class="btn o" target="_blank" rel="noopener" href="'+waUrl((CFG&&CFG.pay_wa)||CONFIG.CONTACT_WA,'Namaste, mujhe KarobaarPro plan lena hai. Shop number: '+(ACC.phone||''))+'">WhatsApp</a></div></div>';

/* ============ UI part D: templates, camera barcode, statement ============ */
function addTemplate(biz){
  templateItems(biz).forEach(it=>{const op=it.open0;delete it.open0;D.items.push(Object.assign(it,{u:Date.now()}));D.meta.dirty['items:'+it.id]=Date.now();if(op)addMv(it.id,op,'open','','Shuruaati stock')});
  touch();toast('Template jud gaya — rate apne hisaab se badlein');
}
let CAMSTREAM=null;
async function camScan(){
  if(!isPro()){proSheet('Camera se barcode scan');return}
  let det;try{det=new BarcodeDetector()}catch(e){return toast('Is browser me camera scan nahi chalta')}
  sheet('<h3>📷 Barcode scan</h3><video id="cv" playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:50vh"></video><p class="mut sm center" id="cm">Barcode camera ke saamne rakhein</p><button class="btn g big" id="cx">Band</button>',async s=>{
    let on=true;const stop=()=>{on=false;if(CAMSTREAM){CAMSTREAM.getTracks().forEach(t=>t.stop());CAMSTREAM=null}};
    s.querySelector('#cx').onclick=()=>{stop();closeSheet()};
    try{CAMSTREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=s.querySelector('#cv');v.srcObject=CAMSTREAM;await v.play();
      let last='',lt=0;const loop=async()=>{if(!on||!$('cv'))return stop();try{const r=await det.detect(v);if(r.length){const c=r[0].rawValue;if(c!==last||Date.now()-lt>2500){last=c;lt=Date.now();const it=live('items').find(x=>x.bc===c);if(it){addToCart(it);if(navigator.vibrate)navigator.vibrate(60);s.querySelector('#cm').textContent='✔ '+it.n+' jud gaya — agla scan karein'}else s.querySelector('#cm').textContent='Barcode '+c+' kisi item par nahi hai'}}}catch(e){}setTimeout(loop,350)};loop()
    }catch(e){stop();s.querySelector('#cm').textContent='Camera ki ijazat nahi mili / https chahiye'}})
}
function custStatementDoc(c){
  const sh=D.shop;const L=live('led').filter(x=>x.c===c.id).sort((a,b)=>a.t-b.t);let bal=num(c.open);
  const rows=[];if(num(c.open))rows.push(['—','Pehle ka baaki','',cell(money(bal,1),bal)]);
  L.forEach(x=>{bal+=num(x.a);rows.push([fdate(dOf(x.t)),({sale:'Bill '+(x.note||''),pay:'Payment mila',ret:'Return',man:'Udhar'}[x.r]||'Entry'),cell((x.a>0?'+':'−')+money(Math.abs(x.a)),x.a),cell(money(bal,1),bal)])});
  return{logo:D.shop.logo||'',title:'Customer Statement',head:[{t:sh.name||ACC.shop_name,s:'big'},{t:sh.addr||''},{t:sh.phone?'Ph: '+sh.phone:''}],meta:[['Customer',c.n],['Mobile',c.ph||''],['Tarikh',fdate(today())]],cols:[{h:'Tarikh',w:2},{h:'Vivaran',w:4},{h:'Rakam',w:2,a:'r'},{h:'Baaki',w:2,a:'r'}],rows,totals:[{0:'Abhi baaki',1:money(bal),big:1,length:2}],notes:[sh.upi?'UPI: '+sh.upi:'',sh.footer||''].filter(Boolean),sheet:'Statement'};
}

if(ACC&&(ACC.demo||ACC.token))bootApp();else showAuth('login');
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
